# WeatherMapper — nginx location blocks.
#
# Included from inside the ssl server block in:
#   /etc/nginx/conf.d/routemapper.conf
#
# Static-only app (no backend process). nginx serves the Vite build output
# directly from /opt/weathermapper/client/dist.

# Redirect the no-trailing-slash form so the browser resolves relative asset
# paths correctly. Without this, /weathermapper returns the HTML but asset
# requests like assets/index.js resolve to /assets/index.js (root) instead
# of /weathermapper/assets/index.js.
location = /weathermapper {
    return 301 /weathermapper/;
}

location /weathermapper/ {
    alias /opt/weathermapper/client/dist/;
    index index.html;
    # SPA fallback: any path that isn't a real file serves index.html.
    try_files $uri $uri/ /weathermapper/index.html;
}
